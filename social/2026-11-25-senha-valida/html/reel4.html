<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><style>*{margin:0;padding:0;box-sizing:border-box}

.foot{position:absolute;left:96px;right:96px;bottom:56px;display:flex;justify-content:space-between;align-items:center;font-size:26px;color:#6B7280;border-top:1px solid #E5E7EB;padding-top:28px}
.foot strong{color:#0A4A9E}
</style></head><body><div style="position:absolute;left:96px;right:96px;top:250px;bottom:350px;display:flex;flex-direction:column;justify-content:center"><div><div class="k">O QUE FAZER</div><div style="height:28px"></div><h2 style="font-size:72px;line-height:1.06">4 passos <span>para começar</span></h2><div style="height:52px"></div><div style="display:flex;flex-direction:column;gap:34px"><div class="step"><div class="n">1</div><div>Ative a verificação em duas etapas em todos os acessos.</div></div><div class="step"><div class="n">2</div><div>Revise quem tem acesso e remova o que não é mais usado.</div></div><div class="step"><div class="n">3</div><div>Dê a cada pessoa só o acesso que ela precisa.</div></div><div class="step"><div class="n">4</div><div>Fique de olho em login fora do horário ou de lugar estranho.</div></div></div></div></div></body></html>
