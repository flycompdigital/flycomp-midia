<!doctype html><html><head><meta charset="utf-8"><style>
*{margin:0;padding:0;box-sizing:border-box}html,body{width:300mm;height:400mm;background:transparent}
body{font-family:Inter,sans-serif;color:#fff;display:flex;flex-direction:column;align-items:center;text-align:center;padding-top:8mm}
.logo{width:270mm}

.frase span{color:#e3a630}

.qr{background:#fff;padding:5mm;border-radius:4mm}.qr img{display:block;width:62mm;height:62mm}
.cta{text-align:left;font-weight:800;font-size:10.5mm;line-height:1.25}.cta small{display:block;font-weight:600;font-size:7.5mm;color:#e3a630;margin-top:3mm}
.apoio{margin-top:34mm;line-height:1.6;font-size:8mm;font-weight:700;letter-spacing:1mm;color:#cbd5e1}.apoio b{color:#fff}
</style></head><body>
<img class="logo" src="conseg-logo.svg">
<div class="frase">SEGURANÇA<br>SE FAZ <span>JUNTO.</span></div>

<div class="qrbox"><div class="qr"><img src="qr.svg"></div><div class="cta">Leve para<br>a sua rua<small>con.seg.br</small></div></div>
<div class="apoio">UMA CAUSA <b>APEP BRASIL</b><br><span style="font-size:6.5mm;color:#e3a630">APARTIDÁRIA · SEM VERBA PÚBLICA · É O POVO PELO POVO</span></div>
</body></html>
